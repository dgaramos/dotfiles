# claudio-dr: v0.1.29
name: Publish Claudio DR pull request
on:
  workflow_dispatch:
    inputs:
      title: { description: Pull request title, required: true, type: string }
      body: { description: Completed pull request body, required: true, type: string }
      head_branch: { description: Pushed branch in this repository, required: true, type: string }
      base_branch: { description: Target branch, required: true, type: string }
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAUDIO_DR_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDIO_DR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Create and verify pull request as Claudio DR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISHER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_AUTHOR: claudio-dr[bot]
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: bash .github/scripts/agent-workflows/publish-pr.sh
