# claudio-dr: v0.1.33
# Thin dispatch stub for #260. Every publication behavior lives in the central
# definition below; this file exists only because workflow_dispatch requires the
# workflow to be present on this repository's default branch.
name: Publish Claudio DR review
on:
  workflow_dispatch:
    inputs:
      pr_number: { description: Pull request number, required: true, type: string }
      event: { description: Review event, required: true, default: COMMENT, type: choice, options: [COMMENT] }
      review_body: { description: Review summary in Markdown, required: false, default: '', type: string }
      reviewed_head_sha: { description: Full PR head SHA reviewed, required: true, type: string }
      inline_comments_json: { description: "JSON array of path, line, and body findings", required: false, default: '[]', type: string }
      replies_json: { description: JSON array of comment_id and body replies, required: false, default: '[]', type: string }
      resolve_thread_ids_json: { description: JSON array of thread node IDs, required: false, default: '[]', type: string }
permissions: { contents: read }
jobs:
  publish:
    # The ref is the release surface: the catalog dogfoods @main, while an
    # installed stub pins the protected release tag. See docs/workflow-releases.md.
    uses: dgaramos/dr-agents/.github/workflows/reusable-publish-review.yml@workflows-v1
    with:
      # This stub's own catalog version, passed so the definition can reject
      # a stub that predates an input it requires (dr-agents#268). Must equal
      # the marker at the top of this file; bin/check asserts it.
      stub_version: 0.1.33
      catalog_ref: workflows-v1
      agent: claudio
      client_id: ${{ vars.CLAUDIO_DR_CLIENT_ID }}
      pr_number: ${{ inputs.pr_number }}
      event: ${{ inputs.event }}
      review_body: ${{ inputs.review_body }}
      reviewed_head_sha: ${{ inputs.reviewed_head_sha }}
      inline_comments_json: ${{ inputs.inline_comments_json }}
      replies_json: ${{ inputs.replies_json }}
      resolve_thread_ids_json: ${{ inputs.resolve_thread_ids_json }}
    secrets:
      app_private_key: ${{ secrets.CLAUDIO_DR_PRIVATE_KEY }}
