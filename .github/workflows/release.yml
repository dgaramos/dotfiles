name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run tests
        run: pytest tools/ tests/ -v --cov --cov-report=xml --junit-xml=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: junit.xml

  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a release is needed
        id: gate
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          COMMITS=$(git log --no-merges --pretty=format:"%s" "$RANGE")

          SHOULD_RELEASE="false"
          REASON=""

          if [ -z "$COMMITS" ]; then
            REASON="No release: the range ${RANGE} contains no non-merge commits."
          else
            while IFS= read -r SUBJECT; do
              [ -z "$SUBJECT" ] && continue

              # A breaking change always releases, whatever its type.
              if echo "$SUBJECT" | grep -qE '!:|\bBREAKING CHANGE\b'; then
                SHOULD_RELEASE="true"
                break
              fi

              # docs, chore, ci, build and test ship nothing on their own.
              if echo "$SUBJECT" | grep -qE '^(docs|chore|ci|build|test)(\(.+\))?:'; then
                continue
              fi

              SHOULD_RELEASE="true"
              break
            done <<< "$COMMITS"

            if [ "$SHOULD_RELEASE" = "false" ]; then
              REASON="No release: every commit in ${RANGE} is docs, chore, ci, build or test."
            fi
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_RELEASE" = "true" ]; then
            echo "Releasable commits found in ${RANGE}."
          else
            echo "$REASON"
            echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: [test, gate]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          CURRENT_VERSION=$(cat version)
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --no-merges --pretty=format:"%s" "${LAST_TAG}..HEAD")
          fi

          MAJOR=0; MINOR=0; PATCH=0
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          BUMP="patch"
          while IFS= read -r LINE; do
            if echo "$LINE" | grep -qE '!:|\bBREAKING CHANGE\b'; then
              BUMP="major"
            elif echo "$LINE" | grep -qE '^feat(\(.+\))?:' && [ "$BUMP" != "major" ]; then
              BUMP="minor"
            fi
          done <<< "$COMMITS"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"%H%x09%s" HEAD)
          else
            COMMITS=$(git log --no-merges --pretty=format:"%H%x09%s" "${LAST_TAG}..HEAD")
          fi

          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit"

          NOTES=""
          BREAKING=""
          FEATS=""; FIXES=""; DOCS=""; REFACTORS=""; CHORES=""; TESTS=""; OTHERS=""

          while IFS=$'\t' read -r HASH SUBJECT; do
            [ -z "$HASH" ] && continue

            SHORT="${HASH:0:7}"
            ENTRY="- ${SUBJECT} ([\`${SHORT}\`](${COMMIT_URL}/${HASH}))\n"

            # A breaking change is listed in its own section as well as its type's.
            if echo "$SUBJECT" | grep -qE '!:|\bBREAKING CHANGE\b'; then
              BREAKING="${BREAKING}${ENTRY}"
            fi

            if echo "$SUBJECT" | grep -qE '^feat(\(.+\))?!?:'; then
              FEATS="${FEATS}${ENTRY}"
            elif echo "$SUBJECT" | grep -qE '^fix(\(.+\))?!?:'; then
              FIXES="${FIXES}${ENTRY}"
            elif echo "$SUBJECT" | grep -qE '^docs(\(.+\))?!?:'; then
              DOCS="${DOCS}${ENTRY}"
            elif echo "$SUBJECT" | grep -qE '^refactor(\(.+\))?!?:'; then
              REFACTORS="${REFACTORS}${ENTRY}"
            elif echo "$SUBJECT" | grep -qE '^(chore|build|ci)(\(.+\))?!?:'; then
              CHORES="${CHORES}${ENTRY}"
            elif echo "$SUBJECT" | grep -qE '^test(\(.+\))?!?:'; then
              TESTS="${TESTS}${ENTRY}"
            else
              OTHERS="${OTHERS}${ENTRY}"
            fi
          done <<< "$COMMITS"

          [ -n "$BREAKING" ]  && NOTES="${NOTES}## BREAKING CHANGES\n${BREAKING}\n"
          [ -n "$FEATS" ]     && NOTES="${NOTES}## Features\n${FEATS}\n"
          [ -n "$FIXES" ]     && NOTES="${NOTES}## Bug Fixes\n${FIXES}\n"
          [ -n "$DOCS" ]      && NOTES="${NOTES}## Documentation\n${DOCS}\n"
          [ -n "$REFACTORS" ] && NOTES="${NOTES}## Refactors\n${REFACTORS}\n"
          [ -n "$TESTS" ]     && NOTES="${NOTES}## Tests\n${TESTS}\n"
          [ -n "$CHORES" ]    && NOTES="${NOTES}## Chores\n${CHORES}\n"
          [ -n "$OTHERS" ]    && NOTES="${NOTES}## Other\n${OTHERS}\n"

          # The chain above ends in a failing test whenever the last group is
          # empty; without this the step would exit non-zero under `bash -e`.
          :

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          printf "%b" "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Bump version and tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          TAG="${{ steps.version.outputs.tag }}"

          echo "$NEW_VERSION" > version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version
          git commit -m "chore(release): bump version to ${TAG} [skip ci]"
          git push

          git tag "$TAG"
          git push origin "$TAG"

      - name: Collect assets
        run: |
          mkdir -p dist
          cp tools/sshm/bin/sshm dist/sshm
          cp tools/local-env/bin/local-env dist/local-env
          cp tools/localz/bin/localz dist/localz
          cp tools/check-dotfiles/bin/check-dotfiles dist/check-dotfiles
          cp install.sh dist/install.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            dist/sshm
            dist/local-env
            dist/localz
            dist/check-dotfiles
            dist/install.sh
