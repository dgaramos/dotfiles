# cody-dr: v0.1.31
# Thin dispatch stub for #260. Every publication behavior lives in the central
# definition below; this file exists only because workflow_dispatch requires the
# workflow to be present on this repository's default branch.
name: Publish Cody DR issue

on:
  workflow_dispatch:
    inputs:
      title:
        description: Issue title
        required: true
        type: string
      issue_number:
        description: Existing issue to update (omit to create)
        required: false
        type: string
      body:
        description: Issue body in Markdown
        required: true
        type: string
      labels:
        description: Comma-separated labels
        required: false
        type: string
      assignees:
        description: Comma-separated assignees
        required: false
        type: string
      milestone_number:
        description: Optional numeric milestone number
        required: false
        type: string

permissions:
  contents: read
jobs:
  publish:
    # The ref is the release surface: the catalog dogfoods @main, while an
    # installed stub pins the protected release tag. See docs/workflow-releases.md.
    uses: dgaramos/dr-agents/.github/workflows/reusable-publish-issue.yml@workflows-v1
    with:
      agent: cody
      client_id: ${{ vars.CODY_DR_CLIENT_ID }}
      title: ${{ inputs.title }}
      issue_number: ${{ inputs.issue_number }}
      body: ${{ inputs.body }}
      labels: ${{ inputs.labels }}
      assignees: ${{ inputs.assignees }}
      milestone_number: ${{ inputs.milestone_number }}
    secrets:
      app_private_key: ${{ secrets.CODY_DR_PRIVATE_KEY }}
