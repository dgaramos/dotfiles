# ==============================================================
# Prefix
# ==============================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==============================================================
# General
# ==============================================================
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g escape-time 10          # reduce lag for vim/neovim
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on

set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # close gaps when a window is closed

# ==============================================================
# Mouse
# ==============================================================
set -g mouse on

# ==============================================================
# Key bindings
# ==============================================================
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Intuitive splits (stay in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================
# Copy mode (vi)
# ==============================================================
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==============================================================
# Status bar
# ==============================================================
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]│ "

set -g status-right-length 60
set -g status-right "#[fg=#6c7086]#H #[fg=#6c7086]│ #[fg=#a6e3a1]%Y-%m-%d %H:%M "

setw -g window-status-format         "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold] #I:#W "

# ==============================================================
# Plugins (TPM)
# ==============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
